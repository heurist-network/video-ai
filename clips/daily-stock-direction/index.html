it">4</span><span class="digit">5</span><span class="digit">6</span><span class="digit">7</span><span class="digit">8</span><span class="digit">9</span><span class="digit">0</span><span class="digit">1</span><span class="digit">2</span><span class="digit">3</span><span class="digit">4</span></span></span></span></div><div class="delta">-$4.60</div></div></div><div id="card-2" class="card side lower"><div class="surface"><div class="mesh"></div></div><div class="ticker">NVDA</div><div class="price-group"><div class="price"><span>$212.</span><span class="decimals"><span class="reel"><span class="strip" data-layout-allow-overflow data-layout-allow-occlusion><span class="digit">2</span><span class="digit">3</span><span class="digit">4</span><span class="digit">5</span><span class="digit">6</span><span class="digit">7</span><span class="digit">8</span><span class="digit">9</span><span class="digit">0</span><span class="digit">1</span><span class="digit">2</span></span></span><span class="reel"><span class="strip" data-layout-allow-overflow data-layout-allow-occlusion><span class="digit">9</span><span class="digit">0</span><span class="digit">1</span><span class="digit">2</span><span class="digit">3</span><span class="digit">4</span><span class="digit">5</span><span class="digit">6</span><span class="digit">7</span><span class="digit">8</span><span class="digit">9</span></span></span></span></div><div class="delta">-$6.00</div></div></div></div></div><script>const tl=gsap.timeline({paused:true});
